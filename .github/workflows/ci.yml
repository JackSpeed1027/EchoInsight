# 文件职责：在隔离CI数据库上验证后端、前端及离线数据；不调用平台或付费模型，不部署。
name: Verify
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: insightflow
          MYSQL_USER: insightflow_app
          MYSQL_PASSWORD: ci-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/insightflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false
      DB_USERNAME: insightflow_app
      DB_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
      - name: Repository boundary and documentation links
        run: python3 tools/repository_audit.py
      - name: Backend unit and MySQL integration tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Frontend behavior, formatting and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm format:check
          pnpm build
      - name: Offline tools and synthetic contracts
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/validate_demo.py
          python3 tools/validate_eval.py
