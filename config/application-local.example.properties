# 文件职责：空密钥的本机配置模板；先复制到runtime/application-local.properties再填写，不覆盖已有文件。
# 数据库使用开发者自己的MySQL5.7开发库；用户名/密码只是配置位，不附带本机凭据。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/insightflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=insightflow_app
spring.datasource.password=

# 免费演示为默认状态；启用模型前另行核对供应商、响应身份、价格和预算。
echoinsight.model.enabled=false
echoinsight.model.allow-paid-calls=false
echoinsight.model.api-key=
echoinsight.collection.bilibili.enabled=false
echoinsight.collection.bilibili.worker-enabled=false
