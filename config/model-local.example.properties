# 文件职责：模型本机配置示例；逐项阅读文档后，手动合并到 runtime/application-local.properties。
# 不要覆盖该文件原有数据库配置；不要把真实密钥提交到 Git、截图或日志。
# 默认保持两个开关关闭，启动不需要密钥，也不会调用外部模型。
echoinsight.model.enabled=false
echoinsight.model.allow-paid-calls=false
echoinsight.model.api-key=
# 请求别名固定 deepseek-flash；响应身份独立核对，供应商变更时拒绝旧计划而非静默接受。
echoinsight.model.expected-response-model=deepseek-flash
# 2026-10-16 按 DeepSeek 官方 deepseek-flash 美元峰时、缓存未命中价格填写保守示例；启用前重新核实。
echoinsight.model.price-version=deepseek-flash-2026-08-16-peak
# USD_NANOS：每 Token 的十亿分之一美元。每百万 Token 美元单价乘 1000 后向上取整。
# 输入使用包含缓存未命中和峰时的上限；输出使用最高单价，不将折扣视作已获得。
echoinsight.model.input-nanos-per-token=300
echoinsight.model.output-nanos-per-token=1200
# 0.35 美元能覆盖当前分类最保守的一批预留；讨论单次上限的预留约 0.0434 美元。
echoinsight.model.task-budget-usd=0.35
